<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">DFD Level 1 กระบวนการ 1.0 จัดการบัญชี ผู้ใช้ และการแจ้งเตือน</title>
  <desc id="description">ผู้ใช้งานสี่กลุ่มและผู้ดูแลระบบส่งข้อมูลเข้าสู่กระบวนการจัดการบัญชี ซึ่งเชื่อมต่อกับคลังข้อมูลหกตาราง</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-family:Tahoma,'Noto Sans Thai',sans-serif;font-size:32px;font-weight:700;fill:#0f172a}
      .subtitle{font-family:Tahoma,'Noto Sans Thai',sans-serif;font-size:18px;fill:#475569}
      .entity-title,.process-title,.store-code{font-family:Tahoma,'Noto Sans Thai',sans-serif;font-size:22px;font-weight:700;fill:#0f172a}
      .entity-text,.process-text,.store-name,.flow{font-family:Tahoma,'Noto Sans Thai',sans-serif;font-size:17px;fill:#334155}
      .entity{fill:#fff;stroke:#334155;stroke-width:2}
      .process{fill:#fff7f7;stroke:#dc2626;stroke-width:2.5}
      .store{fill:#f8fafc;stroke:#475569;stroke-width:1.7}
      .flowline{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}
      .guide{fill:none;stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:5 6}
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" class="title">DFD Level 1 : กระบวนการ 1.0 จัดการบัญชี ผู้ใช้ และการแจ้งเตือน</text>
  <text x="800" y="92" text-anchor="middle" class="subtitle">ผู้ใช้งานเป็นหน่วยงานภายนอกระบบ ส่วน D1–D6 คือคลังข้อมูลในฐานข้อมูล</text>

  <rect x="78" y="245" width="255" height="210" class="entity"/>
  <text x="205" y="292" text-anchor="middle" class="entity-title">ผู้ใช้งาน</text>
  <line x1="105" y1="315" x2="305" y2="315" stroke="#cbd5e1"/>
  <text x="205" y="350" text-anchor="middle" class="entity-text">นักศึกษา</text>
  <text x="205" y="380" text-anchor="middle" class="entity-text">อาจารย์</text>
  <text x="205" y="410" text-anchor="middle" class="entity-text">เจ้าหน้าที่สาขา</text>
  <text x="205" y="440" text-anchor="middle" class="entity-text">ผู้ดูแลระบบ</text>

  <rect x="78" y="610" width="255" height="120" class="entity"/>
  <text x="205" y="658" text-anchor="middle" class="entity-title">ผู้ดูแลระบบ</text>
  <text x="205" y="690" text-anchor="middle" class="entity-text">กำหนดสิทธิ์และดูแลบัญชี</text>

  <rect x="570" y="290" width="395" height="300" rx="34" class="process"/>
  <line x1="570" y1="352" x2="965" y2="352" stroke="#fecaca" stroke-width="2"/>
  <text x="767" y="333" text-anchor="middle" class="process-title">1.0</text>
  <text x="767" y="408" text-anchor="middle" class="process-title">จัดการบัญชี ผู้ใช้</text>
  <text x="767" y="440" text-anchor="middle" class="process-title">สิทธิ์ และการแจ้งเตือน</text>
  <text x="767" y="485" text-anchor="middle" class="process-text">สมัครสมาชิก · เข้าสู่ระบบ · เปลี่ยนรหัสผ่าน</text>
  <text x="767" y="516" text-anchor="middle" class="process-text">กำหนดสิทธิ์ · บันทึกประวัติ · แจ้งเตือน</text>

  <path d="M333 334 H570" class="flowline"/>
  <text x="451" y="315" text-anchor="middle" class="flow">ข้อมูลสมัคร/เข้าสู่ระบบ</text>
  <path d="M570 502 H333" class="flowline"/>
  <text x="451" y="532" text-anchor="middle" class="flow">ผลการยืนยันและการแจ้งเตือน</text>
  <path d="M333 670 H510 V550 H570" class="flowline"/>
  <text x="440" y="652" text-anchor="middle" class="flow">ข้อมูลบัญชีและสิทธิ์</text>

  <path d="M965 340 H1048" class="flowline"/>
  <path d="M965 390 H1220 V340 H1295" class="flowline"/>
  <path d="M965 440 H1048" class="flowline"/>
  <path d="M965 490 H1220 V440 H1295" class="flowline"/>
  <path d="M965 540 H1048" class="flowline"/>
  <path d="M965 570 H1220 V540 H1295" class="flowline"/>

  <g>
    <rect x="1050" y="250" width="205" height="92" class="store"/>
    <line x1="1050" y1="272" x2="1255" y2="272" stroke="#475569" stroke-width="1.7"/>
    <text x="1070" y="266" class="store-code">D1</text><text x="1152" y="306" text-anchor="middle" class="store-name">users</text>
    <rect x="1297" y="250" width="205" height="92" class="store"/>
    <line x1="1297" y1="272" x2="1502" y2="272" stroke="#475569" stroke-width="1.7"/>
    <text x="1317" y="266" class="store-code">D2</text><text x="1399" y="306" text-anchor="middle" class="store-name">user_roles</text>
    <rect x="1050" y="350" width="205" height="92" class="store"/>
    <line x1="1050" y1="372" x2="1255" y2="372" stroke="#475569" stroke-width="1.7"/>
    <text x="1070" y="366" class="store-code">D3</text><text x="1152" y="406" text-anchor="middle" class="store-name">password_reset_otp</text>
    <rect x="1297" y="350" width="205" height="92" class="store"/>
    <line x1="1297" y1="372" x2="1502" y2="372" stroke="#475569" stroke-width="1.7"/>
    <text x="1317" y="366" class="store-code">D4</text><text x="1399" y="406" text-anchor="middle" class="store-name">prefixes</text>
    <rect x="1050" y="450" width="205" height="92" class="store"/>
    <line x1="1050" y1="472" x2="1255" y2="472" stroke="#475569" stroke-width="1.7"/>
    <text x="1070" y="466" class="store-code">D5</text><text x="1152" y="506" text-anchor="middle" class="store-name">activity_log</text>
    <rect x="1297" y="450" width="205" height="92" class="store"/>
    <line x1="1297" y1="472" x2="1502" y2="472" stroke="#475569" stroke-width="1.7"/>
    <text x="1317" y="466" class="store-code">D6</text><text x="1399" y="506" text-anchor="middle" class="store-name">notifications</text>
  </g>

  <line x1="80" y1="820" x2="1520" y2="820" class="guide"/>
  <text x="90" y="860" class="subtitle">คำอธิบาย: ผู้ใช้งานสามารถรับการแจ้งเตือนได้ แต่เฉพาะผู้ดูแลระบบมีสิทธิ์กำหนดสิทธิ์และจัดการบัญชีผู้ใช้อื่น</text>
  <text x="90" y="900" class="subtitle">หมายเหตุ: ใน DFD คลังข้อมูลแสดงการอ่าน/บันทึกข้อมูล ไม่ได้แสดงความสัมพันธ์ Primary Key หรือ Foreign Key</text>
</svg>
