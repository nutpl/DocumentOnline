<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="t d"><title id="t">DFD Level 1 กระบวนการ 2.0 จัดการข้อมูลพื้นฐาน</title><desc id="d">ผู้ดูแลระบบจัดการข้อมูลคณะ สาขา บุคลากร ตำแหน่ง กลุ่มเรียน และนักศึกษา</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.h{font:700 31px Tahoma,'Noto Sans Thai';fill:#0f172a}.s{font:18px Tahoma,'Noto Sans Thai';fill:#475569}.b{font:700 21px Tahoma,'Noto Sans Thai';fill:#0f172a}.n{font:17px Tahoma,'Noto Sans Thai';fill:#334155}.e{fill:#fff;stroke:#334155;stroke-width:2}.p{fill:#fff7f7;stroke:#dc2626;stroke-width:2.5}.x{fill:#f8fafc;stroke:#475569;stroke-width:1.6}.l{fill:none;stroke:#334155;stroke-width:1.6;marker-end:url(#a)}</style></defs><rect width="1600" height="980" fill="#fff"/><text x="800" y="58" text-anchor="middle" class="h">DFD Level 1 : กระบวนการ 2.0 จัดการข้อมูลพื้นฐาน</text><text x="800" y="92" text-anchor="middle" class="s">ข้อมูลโครงสร้างคณะ สาขา บุคลากร กลุ่มเรียน และนักศึกษา</text><rect x="70" y="365" width="255" height="125" class="e"/><text x="198" y="415" text-anchor="middle" class="b">ผู้ดูแลระบบ</text><text x="198" y="449" text-anchor="middle" class="n">เพิ่ม · แก้ไข · ลบ · ค้นหา</text><rect x="530" y="305" width="390" height="285" rx="34" class="p"/><text x="725" y="350" text-anchor="middle" class="b">2.0</text><text x="725" y="415" text-anchor="middle" class="b">จัดการข้อมูลพื้นฐาน</text><text x="725" y="452" text-anchor="middle" class="n">คณะ · สาขา · ตำแหน่ง · บุคลากร</text><text x="725" y="482" text-anchor="middle" class="n">กลุ่มเรียน · นักศึกษา · ผู้ดำรงตำแหน่ง</text><path d="M325 425H530" class="l"/><text x="425" y="404" text-anchor="middle" class="n">ข้อมูลสำหรับจัดการ</text><g><rect x="1030" y="180" width="210" height="76" class="x"/><text x="1050" y="207" class="b">D7</text><text x="1135" y="229" text-anchor="middle" class="n">faculty<